name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      # Pinned to commit SHAs so a compromised tag cannot change CI behaviour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # wrangler.jsonc is intentionally not committed; tests and the dry-run
      # read wrangler.example.jsonc and inject their own bindings.
      - run: npm run check
      - run: npm run lint
      - run: npm run types:check
      - run: npm run test:coverage
      - run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir .wrangler/dry-run
